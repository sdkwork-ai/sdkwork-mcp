# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.cloud.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/mcp/webserver.pid;
error_log /var/log/sdkwork/mcp/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    upstream gateway {
        least_conn;
        keepalive 32;
        server sdkwork-api-cloud-gateway:8080;
    }
    server {
        listen 80;
        server_name mcp-dev.sdkwork.com mcp-dev.birdcoder.com mcp-dev.dtupay.com mcp-dev.noaper.com mcp-dev.sdkwork.cn mcp-dev.birdcoder.cn mcp-dev.dtupay.cn mcp-dev.noaper.cn mcp-dev.skubc.com mcp-dev.skubc.cn mcp-dev.zowalk.com mcp-dev.zowalk.cn mcp-dev.offer86.com mcp-dev.offer86.cn mcp-dev.86offer.com mcp-dev.86offer.cn;
        include snippets/adaptive-web.named-locations.conf;
        include snippets/gateway-api-locations.nonproduction.conf;
        location / {
            include snippets/adaptive-web.dispatch.conf;
        }
    }
}
