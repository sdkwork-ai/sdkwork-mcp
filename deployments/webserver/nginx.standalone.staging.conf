# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.standalone.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/mcp/webserver.pid;
error_log /var/log/sdkwork/mcp/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    upstream gateway {
        least_conn;
        keepalive 32;
        server 127.0.0.1:8080;
    }
    server {
        listen 80;
        server_name mcp-staging.sdkwork.com mcp-staging.birdcoder.com mcp-staging.dtupay.com mcp-staging.sdkwork.cn mcp-staging.birdcoder.cn mcp-staging.dtupay.cn mcp-staging.skubc.com mcp-staging.skubc.cn mcp-staging.zowalk.com mcp-staging.zowalk.cn mcp-staging.offer86.com mcp-staging.offer86.cn mcp-staging.86offer.com mcp-staging.86offer.cn;
        include snippets/gateway-locations.nonproduction.conf;
    }
}
