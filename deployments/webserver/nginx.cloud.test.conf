# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.cloud.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/mcp/webserver.pid;
error_log /var/log/sdkwork/mcp/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    upstream gateway {
        least_conn;
        keepalive 32;
        server sdkwork-api-cloud-gateway:8080;
    }
    server {
        listen 80;
        server_name mcp-test.sdkwork.com mcp-test.birdcoder.com mcp-test.dtupay.com mcp-test.sdkwork.cn mcp-test.birdcoder.cn mcp-test.dtupay.cn mcp-test.skubc.com mcp-test.skubc.cn mcp-test.zowalk.com mcp-test.zowalk.cn mcp-test.offer86.com mcp-test.offer86.cn mcp-test.86offer.com mcp-test.86offer.cn;
        include snippets/gateway-locations.nonproduction.conf;
    }
}
